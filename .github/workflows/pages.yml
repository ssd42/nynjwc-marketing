# Deploys the built site to GitHub Pages on every push to main.
# This workflow only uses workflow-internal outputs (no user-controlled
# inputs like issue/PR titles, commit messages, or branch names from forks),
# so command injection isn't a concern here.
name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The phone preview imports the real app screens via the @/ alias,
      # which resolves to ../nynjwc-frontend/src (sibling on local disk).
      # CI doesn't have that sibling, so we sparse-checkout it from the
      # monorepo and drop it one level above the workspace.
      - name: Check out frontend from monorepo
        uses: actions/checkout@v4
        with:
          repository: ssd42/nynjwc
          token: ${{ secrets.MONOREPO_PAT }}
          path: __monorepo
          sparse-checkout: nynjwc-frontend

      - name: Place frontend as sibling
        run: |
          mv __monorepo/nynjwc-frontend "$RUNNER_WORKSPACE/nynjwc-frontend"
          rm -rf __monorepo

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      # Headless Chromium for the prerender step inside `npm run build`.
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
